packages:
  - "apps/*"
  - "packages/*"

# Versions shared by two or more workspace packages. Reference them as "catalog:".
catalog:
  "@content-collections/core": ^0.15.3
  "@mdx-js/mdx": ^3.1.1
  "@tailwindcss/postcss": ^4
  "@types/node": ^24
  "@types/react": ^19
  "@types/react-dom": ^19
  eslint: ^10
  lucide-react: ^1.72.0
  next-themes: ^0.4.6
  react: 19.3.1
  react-dom: 19.3.1
  typescript: ^5
  vitest: ^5.1.0
  zod: ^4.6.7

# next@16.4.5 resolved baseline-browser-mapping 2.10.32, which has a moderate
# advisory (GHSA-w5vr-8v7q-w6rv, fixed in 2.11.0). next's own range (^2.9.19)
# allows the fix, but `pnpm update` picks the newest release (days old), so
# next's copy is pinned to the 2.11 release this lockfile already uses for
# its other dependents. Same major. Remove when next resolves >=2.11 itself.
overrides:
  "next>baseline-browser-mapping": 2.11.36

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
